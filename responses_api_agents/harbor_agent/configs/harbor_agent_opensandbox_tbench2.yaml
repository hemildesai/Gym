harbor_agent:
  responses_api_agents:
    harbor_agent:
      entrypoint: app.py
      domain: agent
      description: Harbor Terminus 2 Terminal-Bench 2 evaluation on OpenSandbox.
      value: Evaluate terminal-agent capabilities with isolated Kubernetes sandboxes.
      concurrency: 128

      harbor_datasets:
        tbench2:
          local_dataset_path: ${oc.env:HARBOR_TASKS_DIR,/mnt/rl-workspace/gym-eval/data/terminal_bench_2_harbor_tasks}
          workdir: /app

      harbor_agent_name: null
      harbor_agent_import_path: responses_api_agents.harbor_agent.custom_agents.terminus_2_nemo_gym:Terminus2NemoGym
      harbor_agent_kwargs:
        max_turns: 100
        suppress_max_turns_warning: true
        interleaved_thinking: true
        enable_summarize: false
        record_terminal_session: true
        collect_rollout_details: true
        trajectory_config:
          raw_content: true
        model_info:
          max_input_tokens: 49152
          max_output_tokens: 49152
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0

      harbor_environment_type: null
      harbor_environment_import_path: responses_api_agents.harbor_agent.sandbox:SandboxHarborEnvironment
      harbor_environment_kwargs:
        provider:
          name: opensandbox
          kwargs:
            domain: opensandbox-server.opensandbox-system.svc.cluster.local
            api_key: ${oc.env:OPENSANDBOX_API_KEY}
            protocol: http
            use_server_proxy: true
            batch_create_concurrency: 128
            batch_create_progress_timeout_s: 300
            batch_create_retries: 10
            batch_create_retry_delay_s: 5.0
            batch_create_retry_max_delay_s: 90.0
            request_timeout_s: 300
            create_request_timeout_s: 1200
            create_timeout_s: 1200
            create_probe_timeout_s: 60
            sdk_max_connections: 512
            sdk_max_keepalive_connections: 0
        spec:
          timeout_s: 18000
          ready_timeout_s: 1200
          image_rewrites:
            - from: alexgshaw/
              to: mirror.gcr.io/alexgshaw/
          resources:
            cpu: "1"
            memory: 4Gi
          platform:
            os: linux
            arch: amd64
          metadata:
            benchmark: terminal-bench-2
            harness: terminus-2
            sandbox-api: opensandbox-sdk
        environment_target_dir: /app
        upload_environment_dir: true
        default_cwd: /app
        default_exec_timeout_s: 900
        start_probe_timeout_s: 60

      model_server:
        type: responses_api_models
        name: policy_model

      harbor_agent_override_timeout: null
      harbor_agent_override_setup_timeout: null
      harbor_agent_max_timeout: 14400
      harbor_verifier_override_timeout: null
      harbor_verifier_max_timeout: 7200
      harbor_timeout_multiplier: null
      harbor_jobs_dir: ${oc.env:HARBOR_JOBS_DIR,/tmp/harbor_jobs}
