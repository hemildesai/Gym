apiVersion: sandbox.opensandbox.io/v1alpha1
kind: BatchSandbox
metadata:
  name: nemo-batch-scale-smoke
  namespace: opensandbox
  labels:
    app.kubernetes.io/name: nemo-gym-sandbox
    app.kubernetes.io/component: batchsandbox-scale-smoke
spec:
  replicas: 8
  poolRef: swe-agent-pool
  taskResourcePolicyWhenCompleted: Retain
  taskTemplate:
    spec:
      process:
        command: ["/bin/sh"]
        args:
          - "-c"
          - "python --version && uv --version"
        timeoutSeconds: 120
