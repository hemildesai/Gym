apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nemo-gym-opensandbox-helper-image-prepull
  namespace: opensandbox
  labels:
    app.kubernetes.io/name: opensandbox-helper-image-prepull
    app.kubernetes.io/component: image-prepull
    app.kubernetes.io/part-of: sandbox-gym-eval
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-helper-image-prepull
      app.kubernetes.io/component: image-prepull
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-helper-image-prepull
        app.kubernetes.io/component: image-prepull
        app.kubernetes.io/part-of: sandbox-gym-eval
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 5
      tolerations:
        - operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodeGroup
                    operator: In
                    values: [customer-cpu]
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: In
                    values: [cpu]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nodeGroup
                    operator: In
                    values: [customer-cpu]
      initContainers:
        - name: task-executor
          image: mirror.gcr.io/opensandbox/task-executor:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["test -x /workspace/server || test -f /workspace/server"]
        - name: execd
          image: mirror.gcr.io/opensandbox/execd:v1.0.15
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["test -x ./execd && test -f ./bootstrap.sh"]
      containers:
        - name: hold
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 1m
              memory: 16Mi
            limits:
              cpu: 10m
              memory: 32Mi
