apiVersion: batch/v1
kind: Job
metadata:
  generateName: nemo-gym-harbor-mini-swe-eval-
  namespace: default
  labels:
    app.kubernetes.io/name: nemo-gym-sandbox-eval
    app.kubernetes.io/component: gym-harbor-mini-swe-obs-full
    app.kubernetes.io/part-of: sandbox-gym-eval
    sandbox.nemo-gym/benchmark: swebench-verified
    sandbox.nemo-gym/harness: harbor-mini-swe-agent
    sandbox.nemo-gym/agent-api: responses
    kai.scheduler/queue: backfill
spec:
  # Keep a single coordinator pod. Sandbox and rollout fanout is controlled by
  # CONCURRENCY / num_samples_in_parallel inside the pod.
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nemo-gym-sandbox-eval
        app.kubernetes.io/component: gym-harbor-mini-swe-obs-full
        app.kubernetes.io/part-of: sandbox-gym-eval
        sandbox.nemo-gym/benchmark: swebench-verified
        sandbox.nemo-gym/harness: harbor-mini-swe-agent
        sandbox.nemo-gym/agent-api: responses
        kai.scheduler/queue: backfill
    spec:
      restartPolicy: Never
      schedulerName: default-scheduler
      serviceAccountName: nemo-rl-endpoint-registry
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodeGroup
                    operator: In
                    values: [customer-cpu]
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: In
                    values: [cpu]
                  - key: karpenter.k8s.aws/instance-generation
                    operator: Gt
                    values: ["5"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nodeGroup
                    operator: In
                    values: [customer-cpu]
      containers:
        - name: runner
          image: mirror.gcr.io/astral/uv:python3.12-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              if ! command -v git >/dev/null 2>&1; then
                if command -v apt-get >/dev/null 2>&1; then
                  DEBIAN_FRONTEND=noninteractive apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install -y git
                else
                  echo "git is required to install Harbor from responses_api_agents/harbor_agent/requirements.txt" >&2
                  exit 1
                fi
              fi

              WORKSPACE_ROOT="${GYM_EVAL_WORKSPACE_ROOT:-/mnt/rl-workspace/gym-eval}"
              DEPS_ROOT="${GYM_DEPS_ROOT:-/mnt/rl-workspace/gym/deps}"
              GYM_DIR="${GYM_DIR:-${DEPS_ROOT}/Gym}"
              GYM_INFRA_DIR="${GYM_INFRA_DIR:-${GYM_DIR}/infra/examples/opensandbox}"
              OPENSANDBOX_PYTHON_DIR="${OPENSANDBOX_PYTHON_DIR:-${DEPS_ROOT}/opensandbox-python}"
              HARBOR_DIR="${HARBOR_DIR:-${DEPS_ROOT}/harbor}"
              EVAL_BENCHMARK="${EVAL_BENCHMARK:-swebench}"
              case "${EVAL_BENCHMARK}" in
                swebench|swebench-verified)
                  BENCHMARK_LABEL="swebench-verified"
                  HARNESS_LABEL="harbor-mini-swe-agent"
                  HARBOR_EVAL_AGENT="mini_swe"
                  DEFAULT_HARBOR_CONFIG_PATH="responses_api_agents/harbor_agent/configs/harbor_agent_opensandbox_swebench_mini.yaml"
                  DATASET_ALIAS="swebench"
                  RUN_SUBDIR="swebench_verified_harbor"
                  RUN_SUFFIX="gym-harbor-mini-swe-eval"
                  DEFAULT_TASKS_DIR="${WORKSPACE_ROOT}/data/harbor_swebench_verified_official"
                  DEFAULT_TASK_LIMIT="500"
                  DEFAULT_UPLOAD_ENVIRONMENT_DIR="false"
                  DEFAULT_POOL_PREFIX="swefastghcr"
                  DEFAULT_SWEBENCH_EPOCH_GHCR="1"
                  ;;
                tbench2|terminal-bench|terminal-bench-2)
                  BENCHMARK_LABEL="terminal-bench-2"
                  HARNESS_LABEL="harbor-terminus-2"
                  HARBOR_EVAL_AGENT="terminus_2"
                  DEFAULT_HARBOR_CONFIG_PATH="responses_api_agents/harbor_agent/configs/harbor_agent_opensandbox_tbench2.yaml"
                  DATASET_ALIAS="tbench2"
                  RUN_SUBDIR="terminal_bench_2_harbor"
                  RUN_SUFFIX="gym-harbor-tbench2-eval"
                  DEFAULT_TASKS_DIR="${WORKSPACE_ROOT}/data/terminal_bench_2_harbor_tasks"
                  DEFAULT_TASK_LIMIT="89"
                  DEFAULT_UPLOAD_ENVIRONMENT_DIR="true"
                  DEFAULT_POOL_PREFIX="tbench2"
                  DEFAULT_SWEBENCH_EPOCH_GHCR="0"
                  ;;
                *)
                  echo "Unknown EVAL_BENCHMARK=${EVAL_BENCHMARK}; expected swebench or tbench2" >&2
                  exit 1
                  ;;
              esac
              RUN_ID="$(date -u +%Y%m%d-%H%M%S)-${RUN_SUFFIX}"
              RUN_DIR="${GYM_EVAL_RUN_DIR:-${WORKSPACE_ROOT}/runs/${RUN_SUBDIR}/${RUN_ID}}"
              TASKS_DIR="${HARBOR_TASKS_DIR:-${DEFAULT_TASKS_DIR}}"
              HARBOR_JOBS_DIR="${HARBOR_JOBS_DIR:-${WORKSPACE_ROOT}/harbor_jobs}"
              INPUT=${RUN_DIR}/input.jsonl
              OUTPUT=${RUN_DIR}/rollouts.jsonl
              LOG_DIR=${RUN_DIR}/logs
              OBSERVABILITY_DIR=${RUN_DIR}/observability
              ARCH_KEY="$(uname -m)"
              DEFAULT_VENV_ROOT="${NEMO_GYM_UV_VENV_ROOT:-${WORKSPACE_ROOT}/venvs}"
              VENV_DIR="${NEMO_GYM_UV_VENV_DIR:-${DEFAULT_VENV_ROOT}/harbor-mini-swe-py312-${ARCH_KEY}}"
              POOL_NAMES_FILE=${RUN_DIR}/opensandbox_pools.txt
              POOL_FILTER_FILE=${RUN_DIR}/opensandbox_pool_filter.txt
              export INPUT
              export POOL_FILTER_FILE
              export HARBOR_JOBS_DIR
              CONCURRENCY="${CONCURRENCY:-2}"
              CREATE_CONCURRENCY="${CREATE_CONCURRENCY:-2}"
              SDK_MAX_CONNECTIONS="${SDK_MAX_CONNECTIONS:-64}"
              SDK_MAX_KEEPALIVE_CONNECTIONS="${SDK_MAX_KEEPALIVE_CONNECTIONS:-0}"
              TASK_LIMIT="${TASK_LIMIT:-${DEFAULT_TASK_LIMIT}}"
              TASK_OFFSET="${TASK_OFFSET:-0}"
              TASK_STRIDE="${TASK_STRIDE:-1}"
              TASK_SAMPLE_SEED="${TASK_SAMPLE_SEED:-}"
              NUM_REPEATS="${NUM_REPEATS:-1}"
              EXCLUDE_ROLLOUTS="${EXCLUDE_ROLLOUTS:-}"
              echo "Using venv dir: ${VENV_DIR}"
              if [ "${NEMO_GYM_REBUILD_VENVS:-0}" = "1" ]; then
                rm -rf "${VENV_DIR}"
              fi
              mkdir -p "${RUN_DIR}" "${LOG_DIR}" "${OBSERVABILITY_DIR}" "${HARBOR_JOBS_DIR}"

              export UV_CACHE_DIR="${UV_CACHE_DIR:-${WORKSPACE_ROOT}/.uv-cache}"
              export XDG_DATA_HOME="${XDG_DATA_HOME:-${WORKSPACE_ROOT}/.local/share}"
              export HF_HOME="${HF_HOME:-${WORKSPACE_ROOT}/hf-cache}"
              export PYTHONPATH="${GYM_DIR}:${OPENSANDBOX_PYTHON_DIR}:${OPENSANDBOX_PYTHON_DIR}/src:${HARBOR_DIR}:${HARBOR_DIR}/src${PYTHONPATH:+:${PYTHONPATH}}"
              export HYDRA_FULL_ERROR=1
              export PYTHONDONTWRITEBYTECODE=1
              export NEMO_RL_SANDBOX_OBSERVABILITY_DIR="${NEMO_RL_SANDBOX_OBSERVABILITY_DIR:-${OBSERVABILITY_DIR}}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_RUN_ID="${NEMO_RL_SANDBOX_OBSERVABILITY_RUN_ID:-${RUN_ID}}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_RESOURCE_INTERVAL_S="${NEMO_RL_SANDBOX_OBSERVABILITY_RESOURCE_INTERVAL_S:-10}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_MAX_RENDERED="${NEMO_RL_SANDBOX_OBSERVABILITY_MAX_RENDERED:-100}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_RENDER_HTML="${NEMO_RL_SANDBOX_OBSERVABILITY_RENDER_HTML:-1}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_RENDER_PNG="${NEMO_RL_SANDBOX_OBSERVABILITY_RENDER_PNG:-1}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_EXPORT_OTLP_JSON="${NEMO_RL_SANDBOX_OBSERVABILITY_EXPORT_OTLP_JSON:-1}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_WANDB="${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB:-0}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_PROJECT="${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_PROJECT:-nemo-gym-sandbox-eval}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_RUN_NAME="${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_RUN_NAME:-${RUN_ID}}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_ARTIFACT="${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_ARTIFACT:-sandbox-observability-${RUN_ID}}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_MAX_TIME_SERIES_POINTS="${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_MAX_TIME_SERIES_POINTS:-20000}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_MAX_TABLE_ROWS="${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_MAX_TABLE_ROWS:-20000}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_MAX_MEDIA_ITEMS="${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_MAX_MEDIA_ITEMS:-40}"
              export WANDB_PROJECT="${WANDB_PROJECT:-${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_PROJECT}}"
              export WANDB_NAME="${WANDB_NAME:-${RUN_ID}}"
              export WANDB_DIR="${WANDB_DIR:-${RUN_DIR}/wandb}"
              export WANDB_MODE="${WANDB_MODE:-offline}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_LIVE_METRICS="${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_LIVE_METRICS:-0}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_LIVE_INTERVAL_S="${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_LIVE_INTERVAL_S:-30}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_SWE_TIMING="${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_SWE_TIMING:-0}"
              export NEMO_RL_SANDBOX_OBSERVABILITY_VLLM_LABEL_SELECTOR="${NEMO_RL_SANDBOX_OBSERVABILITY_VLLM_LABEL_SELECTOR:-app.kubernetes.io/name=vllm}"
              if [ -n "${OBSERVABILITY_OTEL_ENDPOINT:-}" ]; then
                export NEMO_RL_SANDBOX_OBSERVABILITY_OTEL_ENDPOINT="${OBSERVABILITY_OTEL_ENDPOINT}"
              fi

              cd "${GYM_DIR}"
              cat > .rayignore <<'EOF'
              core
              core.*
              *.core
              __pycache__/
              .pytest_cache/
              .mypy_cache/
              .ruff_cache/
              results/
              wandb/
              EOF
              cat > responses_api_agents/harbor_agent/.rayignore <<'EOF'
              core
              core.*
              *.core
              __pycache__/
              .pytest_cache/
              .mypy_cache/
              .ruff_cache/
              results/
              wandb/
              EOF
              rm -f responses_api_agents/harbor_agent/core responses_api_agents/harbor_agent/core.*

              EXCLUDE_ARGS=()
              if [ -n "${EXCLUDE_ROLLOUTS:-}" ]; then
                for exclude_rollouts in ${EXCLUDE_ROLLOUTS}; do
                  EXCLUDE_ARGS+=(--exclude-rollouts "${exclude_rollouts}")
                done
              fi
              SELECTION_ARGS=(--offset "${TASK_OFFSET}" --stride "${TASK_STRIDE}")
              if [ -n "${TASK_SAMPLE_SEED:-}" ]; then
                SELECTION_ARGS+=(--sample-seed "${TASK_SAMPLE_SEED}")
              fi
              python3 "${GYM_INFRA_DIR}/prepare_gym_tbench_input.py" \
                --tasks-dir "${TASKS_DIR}" \
                --output "${INPUT}" \
                --limit "${TASK_LIMIT}" \
                "${SELECTION_ARGS[@]}" \
                --dataset-alias "${DATASET_ALIAS}" \
                "${EXCLUDE_ARGS[@]}"
              TARGET_ROWS="$(wc -l < "${INPUT}" | tr -d ' ')"
              if [ "${TARGET_ROWS}" -eq 0 ]; then
                echo "No remaining rows to collect after applying excludes"
                exit 0
              fi
              EXPECTED_ROLLOUT_ROWS=$((TARGET_ROWS * NUM_REPEATS))
              if [ "${GYM_SANDBOX_POOL_ENABLED:-0}" = "1" ] \
                && [ "${GYM_SANDBOX_POOL_ACQUIRE_POLICY:-direct_create}" != "fail_fast" ] \
                && [ "${ALLOW_DIRECT_CREATE_FOR_EVAL:-0}" != "1" ]; then
                echo "Eval sandbox pool must use fail_fast; set ALLOW_DIRECT_CREATE_FOR_EVAL=1 only for resilience experiments" >&2
                exit 1
              fi
              if [ "${OPENSANDBOX_GENERATE_HARBOR_TASK_POOLS:-0}" = "1" ] \
                && [ -z "${OPENSANDBOX_POOL_REF_TEMPLATE:-}" ]; then
                OPENSANDBOX_GENERATED_POOL_PREFIX="${OPENSANDBOX_GENERATED_POOL_PREFIX:-${DEFAULT_POOL_PREFIX}}"
                export OPENSANDBOX_POOL_REF_TEMPLATE="${OPENSANDBOX_GENERATED_POOL_PREFIX}-{task_name}-pool"
              fi
              POOL_FILTER_ARGS=()
              if [ -n "${OPENSANDBOX_POOL_REF_TEMPLATE:-}" ]; then
                python3 - <<'PY'
              import hashlib
              import json
              import os
              import re

              label_re = re.compile(r"[^a-z0-9-]+")
              template = os.environ["OPENSANDBOX_POOL_REF_TEMPLATE"]
              names = []
              seen = set()

              def dns(value, max_length=63):
                  sanitized = label_re.sub("-", str(value).lower()).strip("-")
                  if not sanitized:
                      return "resource"
                  if len(sanitized) <= max_length:
                      return sanitized
                  digest = hashlib.sha1(sanitized.encode("utf-8")).hexdigest()[:8]
                  prefix = sanitized[: max_length - len(digest) - 1].rstrip("-")
                  return f"{prefix}-{digest}" if prefix else digest

              with open(os.environ["INPUT"]) as f:
                  for line in f:
                      if not line.strip():
                          continue
                      instance_id = json.loads(line)["instance_id"]
                      task_name = instance_id.split("::", 1)[1]
                      pool_name = dns(
                          template.format(
                              environment_name=task_name,
                              task_name=task_name,
                          )
                      )
                      if pool_name not in seen:
                          seen.add(pool_name)
                          names.append(pool_name)

              with open(os.environ["POOL_FILTER_FILE"], "w") as f:
                  f.write("\n".join(names) + ("\n" if names else ""))
              PY
                POOL_FILTER_ARGS=(--pool-name-file "${POOL_FILTER_FILE}")
              fi

              UV_RUN=(
                uv run --python 3.12 --no-project
                --with-editable "${GYM_DIR}"
                --with-editable "${OPENSANDBOX_PYTHON_DIR}"
                --with-editable "${HARBOR_DIR}"
                --with tenacity
                --with kubernetes
                --with docker==7.1.0
                --with matplotlib
                --with wandb
                --with pyyaml
              )
              SERVER_PID=""
              COLLECT_PID=""
              STREAM_PIDS=()
              METRICS_PID=""
              TIMING_METRICS_PID=""
              cleanup_prewarmed_sandboxes() {
                if [ "${GYM_SANDBOX_POOL_ENABLED:-0}" != "1" ]; then
                  return 0
                fi
                if [ -z "${SERVER_PID:-}" ] || ! kill -0 "${SERVER_PID}" >/dev/null 2>&1; then
                  return 0
                fi
                "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/prewarm_gym_harbor_sandboxes.py" \
                  cleanup \
                  --agent-name harbor_agent \
                  >>"${LOG_DIR}/sandbox_prewarm_cleanup.log" 2>&1 || true
              }
              stop_live_metrics() {
                if [ -n "${METRICS_PID:-}" ] && kill -0 "${METRICS_PID}" >/dev/null 2>&1; then
                  kill "${METRICS_PID}" >/dev/null 2>&1 || true
                  wait "${METRICS_PID}" >/dev/null 2>&1 || true
                fi
                METRICS_PID=""
                if [ -n "${TIMING_METRICS_PID:-}" ] && kill -0 "${TIMING_METRICS_PID}" >/dev/null 2>&1; then
                  kill "${TIMING_METRICS_PID}" >/dev/null 2>&1 || true
                  wait "${TIMING_METRICS_PID}" >/dev/null 2>&1 || true
                fi
                TIMING_METRICS_PID=""
              }
              cleanup_job() {
                local rc=$?
                stop_live_metrics
                cleanup_prewarmed_sandboxes
                if [ -n "${COLLECT_PID:-}" ] && kill -0 "${COLLECT_PID}" >/dev/null 2>&1; then
                  kill "${COLLECT_PID}" >/dev/null 2>&1 || true
                  wait "${COLLECT_PID}" >/dev/null 2>&1 || true
                fi
                if [ "${#STREAM_PIDS[@]}" -gt 0 ]; then
                  for stream_pid in "${STREAM_PIDS[@]}"; do
                    if kill -0 "${stream_pid}" >/dev/null 2>&1; then
                      kill "${stream_pid}" >/dev/null 2>&1 || true
                    fi
                  done
                  for stream_pid in "${STREAM_PIDS[@]}"; do
                    wait "${stream_pid}" >/dev/null 2>&1 || true
                  done
                  STREAM_PIDS=()
                fi
                if [ -n "${SERVER_PID:-}" ]; then
                  kill "${SERVER_PID}" >/dev/null 2>&1 || true
                fi
                if [ "${OPENSANDBOX_CLEANUP_ON_EXIT:-1}" = "1" ]; then
                  CLEANUP_ARGS=(
                    cleanup
                    --run-id "${RUN_ID}"
                    --pool-names-file "${POOL_NAMES_FILE}"
                  )
                  if [ "${OPENSANDBOX_KEEP_POOLS:-0}" = "1" ]; then
                    CLEANUP_ARGS+=(--keep-pools)
                  fi
                  "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/manage_opensandbox_job_resources.py" \
                    "${CLEANUP_ARGS[@]}" \
                    >>"${LOG_DIR}/opensandbox_cleanup.log" 2>&1 || true
                fi
                exit "${rc}"
              }
              terminate_job() {
                exit 143
              }
              trap cleanup_job EXIT
              trap terminate_job TERM INT

              prepare_stream_chunks() {
                STREAM_DIR="${RUN_DIR}/stream_chunks"
                STREAM_CHUNKS_FILE="${STREAM_DIR}/chunks.tsv"
                export STREAM_DIR STREAM_CHUNKS_FILE INPUT TARGET_ROWS
                mkdir -p "${STREAM_DIR}"
                python3 - <<'PY'
              import json
              import os
              from pathlib import Path

              input_path = Path(os.environ["INPUT"])
              stream_dir = Path(os.environ["STREAM_DIR"])
              chunks_path = Path(os.environ["STREAM_CHUNKS_FILE"])
              target_rows = int(os.environ["TARGET_ROWS"])

              chunks = []
              with input_path.open("r", encoding="utf-8") as f:
                  for task_index, line in enumerate(f):
                      if task_index >= target_rows:
                          break
                      stripped = line.strip()
                      if not stripped:
                          continue
                      row = json.loads(stripped)
                      instance_id = row.get("instance_id")
                      if not isinstance(instance_id, str) or not instance_id:
                          raise RuntimeError(f"Row {task_index} is missing string instance_id")
                      chunk_path = stream_dir / f"task_{task_index:06d}.jsonl"
                      chunk_path.write_text(json.dumps(row, separators=(",", ":")) + "\n", encoding="utf-8")
                      chunks.append((task_index, instance_id, chunk_path))

              with chunks_path.open("w", encoding="utf-8") as f:
                  for task_index, instance_id, chunk_path in chunks:
                      f.write(f"{task_index}\t{instance_id}\t{chunk_path}\n")
              print(f"Prepared {len(chunks)} stream chunks at {stream_dir}", flush=True)
              PY
              }

              collect_gym_rollouts() {
                local input_jsonl="$1"
                local output_jsonl="$2"
                local limit="$3"
                local parallel="$4"
                local log_fpath="$5"
                local collect_timeout_s="${GYM_COLLECT_ROLLOUTS_TIMEOUT_S:-}"
                local command_prefix=()
                if [ -n "${collect_timeout_s}" ]; then
                  if [[ ! "${collect_timeout_s}" =~ ^[0-9]+$ ]]; then
                    echo "GYM_COLLECT_ROLLOUTS_TIMEOUT_S must be an integer number of seconds" >&2
                    return 2
                  fi
                  if [ "${collect_timeout_s}" -gt 0 ]; then
                    command_prefix=(timeout --kill-after=30s "${collect_timeout_s}")
                  fi
                fi
                set +e
                "${command_prefix[@]}" "${UV_RUN[@]}" ng_collect_rollouts \
                  "${COMMON_CONFIG[@]}" \
                  "${POOL_CONFIG[@]}" \
                  +agent_name=harbor_agent \
                  +input_jsonl_fpath="${input_jsonl}" \
                  +output_jsonl_fpath="${output_jsonl}" \
                  +limit="${limit}" \
                  +num_repeats="${NUM_REPEATS}" \
                  +num_samples_in_parallel="${parallel}" \
                  +upload_rollouts_to_wandb=false \
                  "+responses_create_params={temperature: ${GENERATION_TEMPERATURE:-0.6}, top_p: ${GENERATION_TOP_P:-0.95}, max_output_tokens: ${GENERATION_MAX_OUTPUT_TOKENS:-49152}, metadata: {extra_body: \"{\\\"top_k\\\":${GENERATION_TOP_K:-20},\\\"min_p\\\":0.0,\\\"presence_penalty\\\":0.0,\\\"repetition_penalty\\\":1.0}\", chat_template_kwargs: \"{\\\"enable_thinking\\\":${GENERATION_ENABLE_THINKING:-true}}\"}}" \
                  >"${log_fpath}" 2>&1
                local collect_rc=$?
                set -e
                if [ "${collect_rc}" -ne 0 ]; then
                  if [ -s "${output_jsonl}" ] && grep -q "/aggregate_metrics" "${log_fpath}"; then
                    echo "Ignoring post-write aggregate_metrics failure from ng_collect_rollouts for ${input_jsonl}"
                  else
                    tail -n 200 "${log_fpath}"
                    return "${collect_rc}"
                  fi
                fi
                return 0
              }

              rewrite_stream_chunk_rollouts() {
                local task_index="$1"
                local chunk_output="$2"
                local chunk_rewritten_output="$3"
                python3 - "${task_index}" "${chunk_output}" "${chunk_rewritten_output}" <<'PY'
              import json
              import sys
              from pathlib import Path

              task_index = int(sys.argv[1])
              input_path = Path(sys.argv[2])
              output_path = Path(sys.argv[3])

              rows = 0
              with input_path.open("r", encoding="utf-8") as src, output_path.open("w", encoding="utf-8") as dst:
                  for line in src:
                      stripped = line.strip()
                      if not stripped:
                          continue
                      row = json.loads(stripped)
                      row["_ng_task_index"] = task_index
                      dst.write(json.dumps(row, separators=(",", ":")) + "\n")
                      rows += 1
              if rows == 0:
                  raise RuntimeError(f"No rollout rows found in {input_path}")
              print(f"Rewrote {rows} rows for original task index {task_index}", flush=True)
              PY
              }

              write_stream_chunk_failure_rollout() {
                local task_index="$1"
                local instance_id="$2"
                local chunk_input="$3"
                local chunk_rewritten_output="$4"
                local failure_phase="$5"
                local failure_rc="$6"
                local failure_log="$7"
                python3 - \
                  "${task_index}" \
                  "${instance_id}" \
                  "${chunk_input}" \
                  "${chunk_rewritten_output}" \
                  "${failure_phase}" \
                  "${failure_rc}" \
                  "${failure_log}" <<'PY'
              import json
              import os
              import sys
              import time
              from pathlib import Path

              task_index = int(sys.argv[1])
              instance_id = sys.argv[2]
              input_path = Path(sys.argv[3])
              output_path = Path(sys.argv[4])
              failure_phase = sys.argv[5]
              failure_rc = int(sys.argv[6])
              failure_log = sys.argv[7]

              source_row = {}
              with input_path.open("r", encoding="utf-8") as f:
                  for line in f:
                      stripped = line.strip()
                      if stripped:
                          source_row = json.loads(stripped)
                          break
              if source_row.get("instance_id"):
                  instance_id = str(source_row["instance_id"])

              error_message = (
                  f"Stream rollout chunk failed during {failure_phase} for task_index={task_index} "
                  f"instance_id={instance_id}; see {failure_log}"
              )
              row = {
                  "instance_id": instance_id,
                  "_ng_task_index": task_index,
                  "reward": 0.0,
                  "agent_timeout_error": 0,
                  "response": {
                      "id": f"stream_failure_{task_index:06d}",
                      "created_at": time.time(),
                      "error": {
                          "type": "stream_chunk_failed",
                          "code": failure_phase,
                          "message": error_message,
                      },
                      "incomplete_details": None,
                      "instructions": None,
                      "metadata": {},
                      "model": os.environ.get("POLICY_MODEL_NAME"),
                      "object": "response",
                      "output": [],
                      "status": "failed",
                  },
                  "metadata": {
                      "exception_info": {
                          "exception_type": "StreamChunkFailure",
                          "phase": failure_phase,
                          "returncode": failure_rc,
                          "log_path": failure_log,
                      },
                      "stream_chunk_failure": {
                          "phase": failure_phase,
                          "returncode": failure_rc,
                          "log_path": failure_log,
                          "chunk_input": str(input_path),
                      },
                  },
              }
              if "verifier_metadata" in source_row:
                  row["verifier_metadata"] = source_row["verifier_metadata"]
              output_path.write_text(json.dumps(row, separators=(",", ":")) + "\n", encoding="utf-8")
              print(
                  f"Wrote failure rollout for task_index={task_index} instance_id={instance_id} phase={failure_phase}",
                  flush=True,
              )
              PY
              }

              run_stream_chunk() {
                local task_index="$1"
                local instance_id="$2"
                local chunk_input="$3"
                local chunk_label
                printf -v chunk_label "%06d" "${task_index}"
                local chunk_log_dir="${LOG_DIR}/stream_task_${chunk_label}"
                local chunk_output="${STREAM_DIR}/rollouts_${chunk_label}.jsonl"
                local chunk_rewritten_output="${STREAM_DIR}/rollouts_${chunk_label}.rewritten.jsonl"
                local prewarm_repeats="${GYM_SANDBOX_POOL_NUM_REPEATS:-${NUM_REPEATS}}"
                local stream_chunk_concurrency="${GYM_SANDBOX_POOL_STREAM_CHUNK_CONCURRENCY:-${prewarm_repeats}}"
                local stream_prepare_concurrency="${GYM_SANDBOX_POOL_STREAM_PREPARE_CONCURRENCY:-${stream_chunk_concurrency}}"
                mkdir -p "${chunk_log_dir}"
                echo "stream_task_start task_index=${task_index} instance_id=${instance_id}"

                PREWARM_ARGS=(
                  prewarm
                  --agent-name harbor_agent
                  --input-jsonl "${chunk_input}"
                  --limit 1
                  --num-repeats "${prewarm_repeats}"
                  --concurrency "${stream_chunk_concurrency}"
                  --create-concurrency 1
                  --prepare-concurrency "${stream_prepare_concurrency}"
                  --retries "${GYM_SANDBOX_POOL_PREWARM_RETRIES:-3}"
                  --retry-delay-s "${GYM_SANDBOX_POOL_PREWARM_RETRY_DELAY_S:-10}"
                  --retry-backoff "${GYM_SANDBOX_POOL_PREWARM_RETRY_BACKOFF:-2}"
                  --retry-max-delay-s "${GYM_SANDBOX_POOL_PREWARM_RETRY_MAX_DELAY_S:-60}"
                )
                if [ "${GYM_SANDBOX_POOL_PREWARM_ENVIRONMENT_SETUP:-0}" = "1" ]; then
                  PREWARM_ARGS+=(--prepare-environment)
                fi
                local prewarm_rc=0
                "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/prewarm_gym_harbor_sandboxes.py" \
                  "${PREWARM_ARGS[@]}" \
                  >"${chunk_log_dir}/sandbox_prewarm.json" 2>&1 || prewarm_rc=$?
                if [ "${prewarm_rc}" -ne 0 ]; then
                  write_stream_chunk_failure_rollout \
                    "${task_index}" \
                    "${instance_id}" \
                    "${chunk_input}" \
                    "${chunk_rewritten_output}" \
                    "prewarm" \
                    "${prewarm_rc}" \
                    "${chunk_log_dir}/sandbox_prewarm.json"
                  echo "stream_task_failed task_index=${task_index} instance_id=${instance_id} phase=prewarm rc=${prewarm_rc}"
                  return 0
                fi

                local collect_rc=0
                collect_gym_rollouts \
                  "${chunk_input}" \
                  "${chunk_output}" \
                  1 \
                  "${stream_chunk_concurrency}" \
                  "${chunk_log_dir}/ng_collect_rollouts.log" || collect_rc=$?
                if [ "${collect_rc}" -ne 0 ]; then
                  write_stream_chunk_failure_rollout \
                    "${task_index}" \
                    "${instance_id}" \
                    "${chunk_input}" \
                    "${chunk_rewritten_output}" \
                    "collect" \
                    "${collect_rc}" \
                    "${chunk_log_dir}/ng_collect_rollouts.log"
                  echo "stream_task_failed task_index=${task_index} instance_id=${instance_id} phase=collect rc=${collect_rc}"
                  return 0
                fi

                local rewrite_rc=0
                rewrite_stream_chunk_rollouts \
                  "${task_index}" \
                  "${chunk_output}" \
                  "${chunk_rewritten_output}" || rewrite_rc=$?
                if [ "${rewrite_rc}" -ne 0 ]; then
                  write_stream_chunk_failure_rollout \
                    "${task_index}" \
                    "${instance_id}" \
                    "${chunk_input}" \
                    "${chunk_rewritten_output}" \
                    "rewrite" \
                    "${rewrite_rc}" \
                    "${chunk_log_dir}/ng_collect_rollouts.log"
                  echo "stream_task_failed task_index=${task_index} instance_id=${instance_id} phase=rewrite rc=${rewrite_rc}"
                  return 0
                fi
                echo "stream_task_done task_index=${task_index} instance_id=${instance_id} output=${chunk_rewritten_output}"
              }

              collect_streaming_rollouts() {
                prepare_stream_chunks
                "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/prewarm_gym_harbor_sandboxes.py" \
                  cleanup \
                  --agent-name harbor_agent \
                  >"${LOG_DIR}/sandbox_prewarm_cleanup_before_stream.log" 2>&1 || true

                local stream_workers="${GYM_SANDBOX_POOL_STREAM_WORKERS:-${GYM_SANDBOX_POOL_PREWARM_TASK_CONCURRENCY:-${CREATE_CONCURRENCY}}}"
                if [ "${stream_workers}" -lt 1 ]; then
                  echo "GYM_SANDBOX_POOL_STREAM_WORKERS must be >= 1" >&2
                  return 1
                fi
                local stream_rc=0
                local active_pids=()
                STREAM_PIDS=()
                : >"${LOG_DIR}/ng_collect_rollouts.log"

                wait_for_stream_slot() {
                  local next_active=()
                  while [ "${#active_pids[@]}" -ge "${stream_workers}" ]; do
                    next_active=()
                    for pid in "${active_pids[@]}"; do
                      if kill -0 "${pid}" >/dev/null 2>&1; then
                        next_active+=("${pid}")
                      else
                        if ! wait "${pid}"; then
                          stream_rc=1
                        fi
                      fi
                    done
                    active_pids=("${next_active[@]}")
                    if [ "${#active_pids[@]}" -ge "${stream_workers}" ]; then
                      sleep "${GYM_SANDBOX_POOL_STREAM_POLL_INTERVAL_S:-5}"
                    fi
                  done
                }

                while IFS=$'\t' read -r task_index instance_id chunk_input; do
                  run_stream_chunk "${task_index}" "${instance_id}" "${chunk_input}" \
                    >>"${LOG_DIR}/ng_collect_rollouts.log" 2>&1 &
                  local pid=$!
                  STREAM_PIDS+=("${pid}")
                  active_pids+=("${pid}")
                  wait_for_stream_slot
                done < "${STREAM_CHUNKS_FILE}"

                for pid in "${active_pids[@]}"; do
                  if ! wait "${pid}"; then
                    stream_rc=1
                  fi
                done
                STREAM_PIDS=()
                if [ "${stream_rc}" -ne 0 ]; then
                  tail -n 200 "${LOG_DIR}/ng_collect_rollouts.log"
                  return "${stream_rc}"
                fi

                : >"${OUTPUT}"
                while IFS=$'\t' read -r task_index _instance_id _chunk_input; do
                  local chunk_label
                  printf -v chunk_label "%06d" "${task_index}"
                  local chunk_rewritten_output="${STREAM_DIR}/rollouts_${chunk_label}.rewritten.jsonl"
                  if [ ! -s "${chunk_rewritten_output}" ]; then
                    echo "Missing stream rollout chunk ${chunk_rewritten_output}" >&2
                    return 1
                  fi
                  cat "${chunk_rewritten_output}" >>"${OUTPUT}"
                done < "${STREAM_CHUNKS_FILE}"
                echo "stream_rollouts_done output=${OUTPUT}"
              }

              WANDB_RUN_ID="$(python3 -c 'import hashlib, os; print(hashlib.sha1(os.environ["NEMO_RL_SANDBOX_OBSERVABILITY_RUN_ID"].encode()).hexdigest()[:16])')"
              export WANDB_RUN_ID
              export WANDB_RESUME="${WANDB_RESUME:-allow}"
              if [ "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB}" = "1" ]; then
                "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/start_wandb_observability_run.py" \
                  --benchmark "${BENCHMARK_LABEL}" \
                  --harness "${HARNESS_LABEL}" \
                  | tee "${RUN_DIR}/wandb_start.json"
              fi
              if [ "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB}" = "1" ] && [ "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_LIVE_METRICS}" = "1" ]; then
                "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/stream_wandb_observability_metrics.py" \
                  "${OBSERVABILITY_DIR}" \
                  --rollouts "${OUTPUT}" \
                  --benchmark "${BENCHMARK_LABEL}" \
                  --harness "${HARNESS_LABEL}" \
                  --target-rows "${TARGET_ROWS}" \
                  --interval-s "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_LIVE_INTERVAL_S}" \
                  --pool-agent-name harbor_agent \
                  --latest-output "${RUN_DIR}/wandb_live_metrics_latest.json" \
                  >"${LOG_DIR}/wandb_live_metrics.log" 2>&1 &
                METRICS_PID=$!
              fi
              if [ "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB}" = "1" ] \
                && [ "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_LIVE_METRICS}" = "1" ] \
                && [ "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_SWE_TIMING}" = "1" ]; then
                "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/stream_wandb_swe_timing_metrics.py" \
                  "${OUTPUT}" \
                  --target-rows "${TARGET_ROWS}" \
                  --interval-s "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_LIVE_INTERVAL_S}" \
                  --latest-output "${RUN_DIR}/wandb_swe_timing_metrics_latest.json" \
                  --wandb-project "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_PROJECT}" \
                  --wandb-run-id "${WANDB_RUN_ID}" \
                  --wandb-run-name "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_RUN_NAME}" \
                  --wandb-dir "${WANDB_DIR}" \
                  --vllm-label-selector "${NEMO_RL_SANDBOX_OBSERVABILITY_VLLM_LABEL_SELECTOR}" \
                  >"${LOG_DIR}/wandb_swe_timing_metrics.log" 2>&1 &
                TIMING_METRICS_PID=$!
              fi
              if [ "${OPENSANDBOX_GENERATE_HARBOR_TASK_POOLS:-0}" = "1" ]; then
                if [ -z "${OPENSANDBOX_GENERATED_POOL_PREFIX:-}" ]; then
                  POOL_TEMPLATE_SUFFIX="-{task_name}-pool"
                  if [[ "${OPENSANDBOX_POOL_REF_TEMPLATE:-}" == *"${POOL_TEMPLATE_SUFFIX}" ]]; then
                    OPENSANDBOX_GENERATED_POOL_PREFIX="${OPENSANDBOX_POOL_REF_TEMPLATE%"${POOL_TEMPLATE_SUFFIX}"}"
                  else
                    OPENSANDBOX_GENERATED_POOL_PREFIX="${DEFAULT_POOL_PREFIX}"
                  fi
                fi
                GENERATED_POOL_MANIFEST="${RUN_DIR}/generated_harbor_task_pools.yaml"
                GENERATED_POOL_REPORT="${RUN_DIR}/generated_harbor_task_pools.report.json"
                GENERATED_POOL_ARGS=(
                  --tasks-dir "${TASKS_DIR}"
                  --output "${GENERATED_POOL_MANIFEST}"
                  --report-output "${GENERATED_POOL_REPORT}"
                  --benchmark-label "${BENCHMARK_LABEL}"
                  --pool-prefix "${OPENSANDBOX_GENERATED_POOL_PREFIX}"
                  --max-tasks "${OPENSANDBOX_GENERATE_POOL_MAX_TASKS:-${TASK_LIMIT}}"
                  --arch "${OPENSANDBOX_GENERATE_POOL_ARCH:-amd64}"
                  --override-cpu "${OPENSANDBOX_GENERATE_POOL_CPU:-2}"
                  --override-memory "${OPENSANDBOX_GENERATE_POOL_MEMORY:-8Gi}"
                  --override-storage "${OPENSANDBOX_GENERATE_POOL_STORAGE:-20Gi}"
                  --limit-cpu "${OPENSANDBOX_GENERATE_POOL_LIMIT_CPU:-4}"
                  --limit-memory "${OPENSANDBOX_GENERATE_POOL_LIMIT_MEMORY:-12Gi}"
                  --limit-storage "${OPENSANDBOX_GENERATE_POOL_LIMIT_STORAGE:-40Gi}"
                  --pool-min "${OPENSANDBOX_GENERATE_POOL_MIN:-1}"
                  --buffer-min "${OPENSANDBOX_GENERATE_POOL_BUFFER_MIN:-0}"
                  --buffer-max "${OPENSANDBOX_GENERATE_POOL_BUFFER_MAX:-1}"
                  --pool-max "${OPENSANDBOX_GENERATE_POOL_MAX:-1}"
                  --execd-image "${OPENSANDBOX_EXECD_IMAGE:-mirror.gcr.io/opensandbox/execd:v1.0.15}"
                )
                if [ "${OPENSANDBOX_GENERATE_POOL_SWEBENCH_EPOCH_GHCR:-${DEFAULT_SWEBENCH_EPOCH_GHCR}}" = "1" ]; then
                  GENERATED_POOL_ARGS+=(--swebench-epoch-ghcr)
                fi
                if [ "${OPENSANDBOX_GENERATE_POOL_MINI_SWE_AGENT_INIT_INSTALL:-0}" = "1" ]; then
                  GENERATED_MINI_SWE_AGENT_PACKAGE="${OPENSANDBOX_GENERATE_POOL_MINI_SWE_AGENT_PACKAGE:-${MINI_SWE_AGENT_PACKAGE:-mini-swe-agent==${MINI_SWE_AGENT_VERSION:-2.1.0}}}"
                  GENERATED_POOL_ARGS+=(
                    --mini-swe-agent-init-install
                    --mini-swe-agent-package "${GENERATED_MINI_SWE_AGENT_PACKAGE}"
                  )
                fi
                "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/generate_harbor_task_pools.py" \
                  "${GENERATED_POOL_ARGS[@]}" \
                  | tee "${RUN_DIR}/generated_harbor_task_pools.log"
                OPENSANDBOX_POOL_MANIFESTS="${OPENSANDBOX_POOL_MANIFESTS:+${OPENSANDBOX_POOL_MANIFESTS} }${GENERATED_POOL_MANIFEST}"
                export OPENSANDBOX_POOL_MANIFESTS
              fi
              : >"${POOL_NAMES_FILE}"
              if [ -n "${OPENSANDBOX_POOL_MANIFESTS:-}" ]; then
                POOL_SCALE_FOR_CONCURRENCY_DEFAULT=1
                POOL_WAIT_AVAILABLE_DEFAULT="${CONCURRENCY}"
                if [ -n "${OPENSANDBOX_POOL_REF_TEMPLATE:-}" ]; then
                  POOL_SCALE_FOR_CONCURRENCY_DEFAULT=0
                  POOL_WAIT_AVAILABLE_DEFAULT=1
                  if [ -n "${OPENSANDBOX_POOL_SCALE_PER_POOL:-}" ]; then
                    POOL_WAIT_AVAILABLE_DEFAULT="${OPENSANDBOX_POOL_SCALE_PER_POOL}"
                  fi
                fi
                for pool_manifest in ${OPENSANDBOX_POOL_MANIFESTS}; do
                  POOL_SCALE_ARGS=()
                  if [ -n "${OPENSANDBOX_POOL_SCALE_PER_POOL:-}" ]; then
                    POOL_SCALE_ARGS+=(--scale-for-concurrency "${OPENSANDBOX_POOL_SCALE_PER_POOL}")
                  elif [ "${OPENSANDBOX_POOL_SCALE_FOR_CONCURRENCY:-${POOL_SCALE_FOR_CONCURRENCY_DEFAULT}}" = "1" ]; then
                    POOL_SCALE_ARGS+=(--scale-for-concurrency "${CONCURRENCY}")
                  fi
                  if [ "${#POOL_SCALE_ARGS[@]}" -gt 0 ]; then
                    POOL_SCALE_ARGS+=(
                      --scale-buffer-extra "${OPENSANDBOX_POOL_SCALE_BUFFER_EXTRA:-0}"
                      --scale-pool-max-extra "${OPENSANDBOX_POOL_SCALE_POOL_MAX_EXTRA:-0}"
                    )
                    if [ "${OPENSANDBOX_POOL_PRESERVE_EXISTING_ALLOCATED:-1}" = "1" ]; then
                      POOL_SCALE_ARGS+=(--preserve-existing-allocated)
                    fi
                  fi
                  "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/manage_opensandbox_job_resources.py" \
                    ensure-pool \
                    --manifest "${pool_manifest}" \
                    "${POOL_SCALE_ARGS[@]}" \
                    "${POOL_FILTER_ARGS[@]}" \
                    --wait-available "${OPENSANDBOX_POOL_WAIT_AVAILABLE:-${POOL_WAIT_AVAILABLE_DEFAULT}}" \
                    --timeout-s "${OPENSANDBOX_POOL_WAIT_TIMEOUT_S:-900}" \
                    --concurrency "${OPENSANDBOX_POOL_MANAGE_CONCURRENCY:-64}" \
                    --names-out "${POOL_NAMES_FILE}" \
                    | tee -a "${RUN_DIR}/opensandbox_pools.log"
                done
              fi
              HARBOR_CONFIG_PATH="${HARBOR_CONFIG_PATH:-${DEFAULT_HARBOR_CONFIG_PATH}}"
              DIRECT_MODEL_BASE_URL="${DIRECT_MODEL_BASE_URL:-${POLICY_BASE_URL:-http://vllm.default.svc.cluster.local:8000/v1}}"
              DIRECT_API_KEY="${POLICY_API_KEY:-dummy}"
              DIRECT_CONFIG_PATH="${RUN_DIR}/harbor_direct_eval.yaml"
              cat > "${DIRECT_CONFIG_PATH}" <<EOF
              harbor_agent:
                responses_api_agents:
                  harbor_agent:
                    direct_model_base_url: ${DIRECT_MODEL_BASE_URL}
                    model_server: null
                    harbor_agent_env:
                      MSWEA_API_KEY: ${DIRECT_API_KEY}
                      OPENAI_API_KEY: ${DIRECT_API_KEY}
                      OPENAI_BASE_URL: ${DIRECT_MODEL_BASE_URL}
                      OPENAI_API_BASE: ${DIRECT_MODEL_BASE_URL}
              EOF
              CONFIG_PATHS="${HARBOR_CONFIG_PATH},${DIRECT_CONFIG_PATH}"
              EXPECTED_SERVER_COUNT="${NEMO_GYM_EXPECTED_SERVER_COUNT:-1}"
              SERVER_READY_PATTERN="All ${EXPECTED_SERVER_COUNT} / ${EXPECTED_SERVER_COUNT} servers ready"
              MINI_SWE_AGENT_VERSION="${MINI_SWE_AGENT_VERSION-2.1.0}"
              if [ -n "${MINI_SWE_AGENT_PACKAGE:-}" ]; then
                MINI_SWE_AGENT_INSTALL_PACKAGE="${MINI_SWE_AGENT_PACKAGE}"
              elif [ -n "${MINI_SWE_AGENT_VERSION}" ]; then
                MINI_SWE_AGENT_INSTALL_PACKAGE="mini-swe-agent==${MINI_SWE_AGENT_VERSION}"
              else
                MINI_SWE_AGENT_INSTALL_PACKAGE="mini-swe-agent"
              fi
              MINI_SWE_CONFIG_PATH="${RUN_DIR}/mini_swe_agent_responses_swebench.yaml"
              export MINI_SWE_CONFIG_SOURCE="${GYM_DIR}/responses_api_agents/harbor_agent/configs/mini_swe_agent_responses_swebench.yaml"
              export MINI_SWE_CONFIG_PATH
              export MINI_SWE_CONFIG_TEMPERATURE="${MINI_SWE_CONFIG_TEMPERATURE:-${GENERATION_TEMPERATURE:-0.6}}"
              export MINI_SWE_CONFIG_TOP_P="${MINI_SWE_CONFIG_TOP_P:-${GENERATION_TOP_P:-0.95}}"
              export MINI_SWE_CONFIG_TOP_K="${MINI_SWE_CONFIG_TOP_K:-${GENERATION_TOP_K:-20}}"
              export MINI_SWE_CONFIG_ENABLE_THINKING="${MINI_SWE_CONFIG_ENABLE_THINKING:-${GENERATION_ENABLE_THINKING:-true}}"
              export MINI_SWE_CONFIG_DROP_PARAMS="${MINI_SWE_CONFIG_DROP_PARAMS-true}"
              export MINI_SWE_CONFIG_PARALLEL_TOOL_CALLS="${MINI_SWE_CONFIG_PARALLEL_TOOL_CALLS-true}"
              export MINI_SWE_CONFIG_STEP_LIMIT="${MINI_SWE_CONFIG_STEP_LIMIT:-}"
              "${UV_RUN[@]}" python - <<'PY'
              import os
              from pathlib import Path

              import yaml

              def env_bool(name: str) -> bool | None:
                  value = os.environ.get(name)
                  if value in (None, "", "null", "None"):
                      return None
                  return value.lower() in ("1", "true", "yes", "on")

              def env_float(name: str) -> float | None:
                  value = os.environ.get(name)
                  if value in (None, "", "null", "None"):
                      return None
                  return float(value)

              def env_int(name: str) -> int | None:
                  value = os.environ.get(name)
                  if value in (None, "", "null", "None"):
                      return None
                  return int(value)

              config = yaml.safe_load(Path(os.environ["MINI_SWE_CONFIG_SOURCE"]).read_text())
              model_kwargs = config.setdefault("model", {}).setdefault("model_kwargs", {})
              for key, value in (
                  ("temperature", env_float("MINI_SWE_CONFIG_TEMPERATURE")),
                  ("top_p", env_float("MINI_SWE_CONFIG_TOP_P")),
              ):
                  if value is None:
                      model_kwargs.pop(key, None)
                  else:
                      model_kwargs[key] = value
              extra_body = model_kwargs.setdefault("extra_body", {})
              top_k = env_int("MINI_SWE_CONFIG_TOP_K")
              if top_k is None:
                  extra_body.pop("top_k", None)
              else:
                  extra_body["top_k"] = top_k
              enable_thinking = env_bool("MINI_SWE_CONFIG_ENABLE_THINKING")
              chat_template_kwargs = extra_body.setdefault("chat_template_kwargs", {})
              if enable_thinking is None:
                  chat_template_kwargs.pop("enable_thinking", None)
              else:
                  chat_template_kwargs["enable_thinking"] = enable_thinking
              if not chat_template_kwargs:
                  extra_body.pop("chat_template_kwargs", None)
              for key, env_name in (
                  ("drop_params", "MINI_SWE_CONFIG_DROP_PARAMS"),
                  ("parallel_tool_calls", "MINI_SWE_CONFIG_PARALLEL_TOOL_CALLS"),
              ):
                  value = env_bool(env_name)
                  if value is None:
                      model_kwargs.pop(key, None)
                  else:
                      model_kwargs[key] = value
              step_limit = env_int("MINI_SWE_CONFIG_STEP_LIMIT")
              if step_limit is not None:
                  config.setdefault("agent", {})["step_limit"] = step_limit
              Path(os.environ["MINI_SWE_CONFIG_PATH"]).write_text(
                  yaml.safe_dump(config, sort_keys=False)
              )
              PY
              MINI_SWE_PREINSTALL_SCRIPT="${RUN_DIR}/mini_swe_preinstall.sh"
              cat > "${MINI_SWE_PREINSTALL_SCRIPT}" <<EOF
              set -e
              EXPECTED_MINI_SWE_AGENT_VERSION="${MINI_SWE_AGENT_VERSION}"
              MINI_SWE_AGENT_INSTALL_PACKAGE="${MINI_SWE_AGENT_INSTALL_PACKAGE}"
              . "\$HOME/.local/bin/env" 2>/dev/null || true
              if command -v mini-swe-agent >/dev/null 2>&1 && mini-swe-agent --help >/dev/null 2>&1; then
                installed_version="\$(uv tool list 2>/dev/null | awk '/^mini-swe-agent / {print \$2; exit}' | sed 's/^v//')"
                if [ -z "\${EXPECTED_MINI_SWE_AGENT_VERSION}" ] || [ "\${installed_version}" = "\${EXPECTED_MINI_SWE_AGENT_VERSION}" ]; then
                  exit 0
                fi
              fi
              needs_packages=0
              for binary in curl git; do
                if ! command -v "\${binary}" >/dev/null 2>&1; then
                  needs_packages=1
                fi
              done
              if [ "\${needs_packages}" = "1" ]; then
                if command -v apt-get >/dev/null 2>&1; then
                  apt_lock_timeout="\${APT_LOCK_TIMEOUT_S:-300}"
                  run_apt() {
                    for attempt in 1 2 3; do
                      if DEBIAN_FRONTEND=noninteractive apt-get \
                        -o "DPkg::Lock::Timeout=\${apt_lock_timeout}" \
                        -o "APT::Get::Lock-Timeout=\${apt_lock_timeout}" \
                        "\$@"; then
                        return 0
                      fi
                      sleep "\$((attempt * 10))"
                    done
                    DEBIAN_FRONTEND=noninteractive apt-get \
                      -o "DPkg::Lock::Timeout=\${apt_lock_timeout}" \
                      -o "APT::Get::Lock-Timeout=\${apt_lock_timeout}" \
                      "\$@"
                  }
                  run_apt update
                  run_apt install -y curl build-essential git
                elif command -v apk >/dev/null 2>&1; then
                  apk add --no-cache curl bash build-base git python3 py3-pip
                elif command -v yum >/dev/null 2>&1; then
                  yum install -y curl git gcc make
                elif command -v dnf >/dev/null 2>&1; then
                  dnf install -y curl git gcc make
                else
                  echo "Warning: no known package manager found, assuming curl/git are available" >&2
                fi
              fi
              if ! command -v curl >/dev/null 2>&1; then
                echo "curl is required to install uv for mini-swe-agent" >&2
                exit 1
              fi
              if ! command -v uv >/dev/null 2>&1; then
                curl -LsSf https://astral.sh/uv/0.7.13/install.sh | sh
              fi
              . "\$HOME/.local/bin/env"
              uv tool install "\${MINI_SWE_AGENT_INSTALL_PACKAGE}"
              ln -sf "\$HOME/.local/bin/mini-swe-agent" /usr/local/bin/mini-swe-agent
              mini-swe-agent --help
              EOF
              MINI_SWE_PREINSTALL_B64="$(base64 < "${MINI_SWE_PREINSTALL_SCRIPT}" | tr -d '\n')"
              MINI_SWE_PREINSTALL_COMMAND="printf %s ${MINI_SWE_PREINSTALL_B64} | base64 -d >/tmp/nemo-mini-swe-preinstall.sh && bash /tmp/nemo-mini-swe-preinstall.sh"
              if [ "${MINI_SWE_AGENT_PREINSTALL:-1}" = "1" ]; then
                MINI_SWE_PRE_AGENT_SETUP_OVERRIDE="+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.pre_agent_setup_commands=[\"${MINI_SWE_PREINSTALL_COMMAND}\"]"
              else
                MINI_SWE_PRE_AGENT_SETUP_OVERRIDE="+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.pre_agent_setup_commands=[]"
              fi
              AGENT_OVERRIDE_CONFIG=()
              if [ "${HARBOR_EVAL_AGENT}" = "mini_swe" ]; then
                AGENT_OVERRIDE_CONFIG=(
                  "+harbor_agent.responses_api_agents.harbor_agent.harbor_agent_import_path=responses_api_agents.harbor_agent.custom_agents.installed:CachedMiniSweAgent"
                  "++harbor_agent.responses_api_agents.harbor_agent.harbor_agent_kwargs.version=${MINI_SWE_AGENT_VERSION:-null}"
                  "++harbor_agent.responses_api_agents.harbor_agent.harbor_agent_kwargs.config_file=${MINI_SWE_CONFIG_PATH}"
                  "${MINI_SWE_PRE_AGENT_SETUP_OVERRIDE}"
                )
              elif [ "${HARBOR_EVAL_AGENT}" = "terminus_2" ]; then
                AGENT_OVERRIDE_CONFIG=(
                  "+harbor_agent.responses_api_agents.harbor_agent.harbor_agent_import_path=responses_api_agents.harbor_agent.custom_agents.terminus_2_nemo_gym:Terminus2NemoGym"
                )
              fi
