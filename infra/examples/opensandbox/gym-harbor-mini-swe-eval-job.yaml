                --wandb-max-media-items "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_MAX_MEDIA_ITEMS}" \
                | tee "${RUN_DIR}/finalize_observability.log"

              "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/summarize_observability_metrics.py" \
                "${OBSERVABILITY_DIR}" \
                --rollouts "${OUTPUT}" \
                | tee "${RUN_DIR}/observability_metrics.json"

              echo "run_dir=${RUN_DIR}"
              echo "input=${INPUT}"
              echo "output=${OUTPUT}"
              echo "logs=${LOG_DIR}"
              echo "observability=${OBSERVABILITY_DIR}"
