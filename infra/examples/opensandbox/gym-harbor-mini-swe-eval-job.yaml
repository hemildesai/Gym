                "++policy_api_key=${POLICY_API_KEY:-dummy}"
                "++policy_model_name=${POLICY_MODEL_NAME:-Qwen/Qwen3.5-27B}"
                "++nemo_gym_log_dir=${LOG_DIR}"
                "++uv_cache_dir=${UV_CACHE_DIR}"
                "++uv_venv_dir=${VENV_DIR}"
                "++skip_venv_if_present=${NEMO_GYM_SKIP_VENV_IF_PRESENT:-true}"
                "++ray_enabled=${NEMO_GYM_RAY_ENABLED:-false}"
                "++default_host=127.0.0.1"
                "++port_range_low=15001"
                "++port_range_high=20000"
                "+harbor_agent.responses_api_agents.harbor_agent.concurrency=${CONCURRENCY}"
                "+harbor_agent.responses_api_agents.harbor_agent.runner_backend=async"
                "+harbor_agent.responses_api_agents.harbor_agent.response_output_mode=${RESPONSE_OUTPUT_MODE}"
                "+harbor_agent.responses_api_agents.harbor_agent.runner_num_cpus=0.0"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_agent_override_timeout=${HARBOR_AGENT_OVERRIDE_TIMEOUT:-null}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_agent_override_setup_timeout=1800"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_run_timeout=${HARBOR_RUN_TIMEOUT:-3900}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_verifier_override_timeout=${HARBOR_VERIFIER_OVERRIDE_TIMEOUT:-null}"
                "${AGENT_OVERRIDE_CONFIG[@]}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.batch_create_concurrency=${CREATE_CONCURRENCY}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.batch_create_progress_timeout_s=${OPENSANDBOX_BATCH_CREATE_PROGRESS_TIMEOUT_S:-300}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.sdk_max_connections=${SDK_MAX_CONNECTIONS}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.sdk_max_keepalive_connections=${SDK_MAX_KEEPALIVE_CONNECTIONS}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.create_probe_command='${OPENSANDBOX_CREATE_PROBE_COMMAND:-true}'"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.create_probe_expected_stdout=${OPENSANDBOX_CREATE_PROBE_EXPECTED_STDOUT:-null}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.create_probe_timeout_s=${OPENSANDBOX_CREATE_PROBE_TIMEOUT_S:-30}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.create_probe_sample_count=${OPENSANDBOX_CREATE_PROBE_SAMPLE_COUNT:-null}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.create_probe_stable_count=${OPENSANDBOX_CREATE_PROBE_STABLE_COUNT:-3}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.create_probe_stable_delay_s=${OPENSANDBOX_CREATE_PROBE_STABLE_DELAY_S:-0.5}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.start_probe_command='${OPENSANDBOX_START_PROBE_COMMAND:-true}'"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.start_probe_expected_stdout=${OPENSANDBOX_START_PROBE_EXPECTED_STDOUT:-null}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.start_probe_timeout_s=${OPENSANDBOX_START_PROBE_TIMEOUT_S:-30}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.upload_environment_dir=${HARBOR_UPLOAD_ENVIRONMENT_DIR:-${DEFAULT_UPLOAD_ENVIRONMENT_DIR}}"
                "++harbor_agent.responses_api_agents.harbor_agent.sandbox_pool.enabled=${GYM_SANDBOX_POOL_ENABLED:-false}"
                "++harbor_agent.responses_api_agents.harbor_agent.sandbox_pool.acquire_policy=${GYM_SANDBOX_POOL_ACQUIRE_POLICY:-direct_create}"
                "++harbor_agent.responses_api_agents.harbor_agent.sandbox_pool.verify_preallocated_handle=${GYM_SANDBOX_POOL_VERIFY_PREALLOCATED_HANDLE:-false}"
                "++harbor_agent.responses_api_agents.harbor_agent.sandbox_pool.fallback_create_for_preallocated_handle=${GYM_SANDBOX_POOL_FALLBACK_CREATE_FOR_PREALLOCATED_HANDLE:-true}"
                "++harbor_agent.responses_api_agents.harbor_agent.sandbox_pool.prewarm_environment_setup=${GYM_SANDBOX_POOL_PREWARM_ENVIRONMENT_SETUP:-false}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.batch_create_retries=10"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.batch_create_retry_delay_s=2.0"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.batch_create_retry_max_delay_s=90.0"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.operation_retries=${OPENSANDBOX_OPERATION_RETRIES:-10}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.operation_retry_delay_s=${OPENSANDBOX_OPERATION_RETRY_DELAY_S:-1.0}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.operation_retry_max_delay_s=${OPENSANDBOX_OPERATION_RETRY_MAX_DELAY_S:-45.0}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.create_request_timeout_s=${OPENSANDBOX_CREATE_REQUEST_TIMEOUT_S:-300}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.create_timeout_s=${OPENSANDBOX_CREATE_TIMEOUT_S:-600}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.provider.kwargs.request_timeout_s=${OPENSANDBOX_REQUEST_TIMEOUT_S:-300}"
                "++harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.spec.timeout_s=7200"
                "++harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.spec.resources.cpu=${SANDBOX_CPU:-500m}"
                "++harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.spec.resources.memory=${SANDBOX_MEMORY:-8Gi}"
                "++harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.spec.resources.ephemeral-storage=${SANDBOX_EPHEMERAL_STORAGE:-20Gi}"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.spec.metadata.run_family=${RUN_SUFFIX}-full"
                "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.spec.metadata.run_id=${RUN_ID}"
              )
              POOL_CONFIG=()
              if [ -n "${OPENSANDBOX_POOL_REF:-}" ]; then
                POOL_CONFIG=(
                  "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.spec.extensions.poolRef=${OPENSANDBOX_POOL_REF}"
                  "++harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.spec.platform=null"
                )
              elif [ -n "${OPENSANDBOX_POOL_REF_TEMPLATE:-}" ]; then
                POOL_CONFIG=(
                  "+harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.pool_ref_template='${OPENSANDBOX_POOL_REF_TEMPLATE}'"
                  "++harbor_agent.responses_api_agents.harbor_agent.harbor_environment_kwargs.spec.platform=null"
                )
              fi

              "${UV_RUN[@]}" ng_run "${COMMON_CONFIG[@]}" "${POOL_CONFIG[@]}" >"${LOG_DIR}/ng_run.log" 2>&1 &
              SERVER_PID=$!
              for _ in $(seq 1 120); do
                if grep -q "${SERVER_READY_PATTERN}" "${LOG_DIR}/ng_run.log"; then
                  break
                fi
                if ! kill -0 "${SERVER_PID}" >/dev/null 2>&1; then
                  tail -n 200 "${LOG_DIR}/ng_run.log"
                  exit 1
                fi
                sleep 5
              done
              if ! grep -q "${SERVER_READY_PATTERN}" "${LOG_DIR}/ng_run.log"; then
                tail -n 200 "${LOG_DIR}/ng_run.log"
                exit 1
              fi

              if [ "${GYM_SANDBOX_POOL_ENABLED:-0}" = "1" ] \
                && { [ "${GYM_SANDBOX_POOL_STREAM_BY_TASK:-1}" != "1" ] || [ "${PREWARM_ONLY:-0}" = "1" ]; }; then
                PREWARM_ARGS=(
                  prewarm \
                  --agent-name harbor_agent \
                  --input-jsonl "${INPUT}" \
                  --limit "${TARGET_ROWS}" \
                  --num-repeats "${GYM_SANDBOX_POOL_NUM_REPEATS:-1}" \
                  --concurrency "${GYM_SANDBOX_POOL_PREWARM_CONCURRENCY:-${CREATE_CONCURRENCY}}" \
                  --create-concurrency "${GYM_SANDBOX_POOL_PREWARM_CREATE_CONCURRENCY:-${GYM_SANDBOX_POOL_PREWARM_CONCURRENCY:-${CREATE_CONCURRENCY}}}" \
                  --prepare-concurrency "${GYM_SANDBOX_POOL_PREWARM_PREPARE_CONCURRENCY:-${GYM_SANDBOX_POOL_PREWARM_CONCURRENCY:-${CREATE_CONCURRENCY}}}" \
                  --retries "${GYM_SANDBOX_POOL_PREWARM_RETRIES:-3}" \
                  --retry-delay-s "${GYM_SANDBOX_POOL_PREWARM_RETRY_DELAY_S:-10}" \
                  --retry-backoff "${GYM_SANDBOX_POOL_PREWARM_RETRY_BACKOFF:-2}" \
                  --retry-max-delay-s "${GYM_SANDBOX_POOL_PREWARM_RETRY_MAX_DELAY_S:-60}" \
                  --replace-existing
                )
                if [ "${GYM_SANDBOX_POOL_PREWARM_ENVIRONMENT_SETUP:-0}" = "1" ]; then
                  PREWARM_ARGS+=(--prepare-environment)
                fi
                "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/prewarm_gym_harbor_sandboxes.py" \
                  "${PREWARM_ARGS[@]}" \
                  | tee "${RUN_DIR}/sandbox_prewarm.json"
              fi
              if [ "${PREWARM_ONLY:-0}" = "1" ]; then
                stop_live_metrics
                "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/summarize_observability_metrics.py" \
                  "${OBSERVABILITY_DIR}" \
                  | tee "${RUN_DIR}/observability_metrics.json"
                echo "prewarm_only=1"
                echo "run_dir=${RUN_DIR}"
                echo "logs=${LOG_DIR}"
                echo "observability=${OBSERVABILITY_DIR}"
                exit 0
              fi

              if [ "${GYM_SANDBOX_POOL_ENABLED:-0}" = "1" ] \
                && [ "${GYM_SANDBOX_POOL_STREAM_BY_TASK:-1}" = "1" ]; then
                collect_streaming_rollouts
              else
                collect_gym_rollouts \
                  "${INPUT}" \
                  "${OUTPUT}" \
                  "${TARGET_ROWS}" \
                  "${CONCURRENCY}" \
                  "${LOG_DIR}/ng_collect_rollouts.log" &
                COLLECT_PID=$!
                wait "${COLLECT_PID}"
                COLLECT_RC=$?
                COLLECT_PID=""
                if [ "${COLLECT_RC}" -ne 0 ]; then
                  exit "${COLLECT_RC}"
                fi
              fi
              cleanup_prewarmed_sandboxes || true

              "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/verify_gym_rollouts.py" \
                "${OUTPUT}" \
                --min-rows "${EXPECTED_ROLLOUT_ROWS}" \
                | tee "${RUN_DIR}/verify.json"

              "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/summarize_harbor_trajectory_timing.py" \
