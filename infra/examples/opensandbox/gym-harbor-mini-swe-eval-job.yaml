                "${OUTPUT}" \
                | tee "${RUN_DIR}/summary.json"

              stop_live_metrics

              "${UV_RUN[@]}" python "${GYM_INFRA_DIR}/finalize_observability_artifacts.py" \
                "${OBSERVABILITY_DIR}" \
                --run-id "${RUN_ID}" \
                --max-rendered-trajectories "${NEMO_RL_SANDBOX_OBSERVABILITY_MAX_RENDERED}" \
                --wandb \
                --wandb-project "${NEMO_RL_SANDBOX_OBSERVABILITY_WANDB_PROJECT}" \
